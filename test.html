                ctx.globalAlpha = 1.0;
                ctx.strokeStyle = '#ecf0f1';
                ctx.lineWidth = 1.2;
                ctx.stroke();

                // Cozy glowing windows & door
                ctx.fillStyle = '#f9ca24';
                ctx.fillRect(h.x - 13, h.y - 8, 3.5, 3.5);
                ctx.fillRect(h.x - 6.5, h.y - 8, 3.5, 3.5);
                ctx.fillStyle = '#4b1e19';
                ctx.fillRect(h.x - 10, h.y, 4, 6);

                // Second Cottage (Right) — brighter shade of town color
                ctx.fillStyle = tc;
                ctx.globalAlpha = 0.85;
                ctx.fillRect(h.x + 2, h.y - 10, 13, 16);
                ctx.globalAlpha = 1.0;
                // Roof
                ctx.fillStyle = tc;
                ctx.globalAlpha = 0.55;
                ctx.beginPath();
                ctx.moveTo(h.x + 1, h.y - 10);
                ctx.lineTo(h.x + 8.5, h.y - 16);
                ctx.lineTo(h.x + 16, h.y - 10);
                ctx.fill();
                ctx.globalAlpha = 1.0;
                ctx.strokeStyle = '#ecf0f1';
                ctx.lineWidth = 1.2;
                ctx.stroke();

                // Windows
                ctx.fillStyle = '#f6e58d';
                ctx.fillRect(h.x + 4, h.y - 6, 3.5, 3.5);
                ctx.fillRect(h.x + 10, h.y - 6, 3.5, 3.5);
                ctx.fillStyle = '#5c2c16';
                ctx.fillRect(h.x + 7, h.y + 1, 3.5, 5);

            } else {
                // ==========================================
                // 🏢 WORKPLACE (COMMERCIAL SKYSCRAPER / FACTORY)
                // ==========================================
                // Concrete Industrial / Plaza Base
                ctx.fillStyle = '#1e272e';
                ctx.beginPath();
                ctx.roundRect(h.x - 20, h.y - 20, 40, 40, 5);
                ctx.fill();

                // Yellow/Black Hazard loading edge indicator
                ctx.fillStyle = '#f39c12';
                ctx.fillRect(h.x - 16, h.y + 15, 32, 3);

                // Outline Glow / Status Border
                ctx.lineWidth = 2.5;
                if (h.timer > 0) {
                    ctx.strokeStyle = '#f1c40f';
                    ctx.setLineDash([4, 3]);
                } else if (connected) {
                    ctx.strokeStyle = '#2ecc71';
                    ctx.setLineDash([]);
                } else {
                    ctx.strokeStyle = '#e74c3c';
                    ctx.setLineDash([]);
                }
                ctx.strokeRect(h.x - 20, h.y - 20, 40, 40);
                ctx.setLineDash([]);

                // Main Skyscraper Monolith Body
                let baseColor = h.color || '#3498db';
                ctx.fillStyle = baseColor;
                ctx.fillRect(h.x - 15, h.y - 16, 30, 29);

                // High-tech Glass Reflection Sheen
                let grad = ctx.createLinearGradient(h.x - 15, h.y - 16, h.x + 15, h.y + 13);
                grad.addColorStop(0, 'rgba(255, 255, 255, 0.55)');
                grad.addColorStop(0.4, 'rgba(255, 255, 255, 0.1)');
                grad.addColorStop(1, 'rgba(0, 0, 0, 0.45)');
                ctx.fillStyle = grad;
                ctx.fillRect(h.x - 15, h.y - 16, 30, 29);

                // Curtain Wall Window Matrix
                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                for (let r = 0; r < 3; r++) {
                    for (let c = 0; c < 3; c++) {
                        ctx.fillRect(h.x - 11 + (c * 8.5), h.y - 12 + (r * 7.5), 5.5, 4);
                    }
                }

                // Rooftop HVAC & Antenna Tower with Beacon
                ctx.fillStyle = '#2f3542';
                ctx.fillRect(h.x - 7, h.y - 19, 14, 4);
                // Antenna mast
                ctx.strokeStyle = '#dcdde1';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(h.x + 4, h.y - 19);
                ctx.lineTo(h.x + 4, h.y - 25);
                ctx.stroke();
                // Red Warning Beacon
                ctx.fillStyle = '#ff4757';
                ctx.beginPath();
                ctx.arc(h.x + 4, h.y - 25, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            // 4. Floating Status Tag (Bottom)
            if (isJammed) {
                let pulse = (Math.sin(Date.now() / 90) + 1) / 2;
                let statusW = 126;
                let statusY = h.y + 26;
                ctx.fillStyle = `rgba(235, 77, 75, ${0.92 + pulse * 0.08})`;
                ctx.beginPath();
                ctx.roundRect(h.x - statusW / 2, statusY, statusW, 18, 9);
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 9.5px sans-serif';
                ctx.fillText('⚠️ EXIT JAMMED (-$50)', h.x, statusY + 12.5);
            } else if (h.timer > 0) {
                let timerText = `⏳ Opens in ${h.timer}s`;
                ctx.font = 'bold 9px sans-serif';
                let timerW = Math.max(80, ctx.measureText(timerText).width + 16);
                let timerY = h.y + 26;
                ctx.fillStyle = 'rgba(20, 24, 28, 0.92)';
                ctx.beginPath();
                ctx.roundRect(h.x - timerW / 2, timerY, timerW, 16, 8);
                ctx.fill();
                ctx.strokeStyle = '#f1c40f';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.fillStyle = '#f1c40f';
                ctx.textAlign = 'center';
                ctx.fillText(timerText, h.x, timerY + 11.5);
            } else {
                let statusW = connected ? 76 : 88;
                let statusY = h.y + 26;
                ctx.fillStyle = 'rgba(20, 24, 28, 0.92)';
                ctx.beginPath();
                ctx.roundRect(h.x - statusW / 2, statusY, statusW, 16, 8);
                ctx.fill();
                ctx.strokeStyle = connected ? '#2ecc71' : '#e74c3c';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.fillStyle = connected ? '#2ecc71' : '#ff7675';
                ctx.font = 'bold 9px sans-serif';
                ctx.fillText(connected ? '🟢 Connected' : '🔴 Needs Road', h.x, statusY + 11.5);
            }

            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(camera.zoom, camera.zoom);
            ctx.translate(-camera.x, -camera.y);

            // 1. Playable World Terrain
            ctx.fillStyle = '#3c5a35';
            ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

            // 2. Playable Area Grid
            ctx.strokeStyle = "rgba(255,255,255,0.04)";
            ctx.lineWidth = 1;
            for (let x = 0; x <= WORLD_WIDTH; x += GRID) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_HEIGHT); ctx.stroke();
            }
            for (let y = 0; y <= WORLD_HEIGHT; y += GRID) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_WIDTH, y); ctx.stroke();
            }

            // 3. Obvious City Limits Perimeter Boundary
            // Ambient outer glow
            ctx.save();
            ctx.strokeStyle = 'rgba(0, 168, 255, 0.25)';
            ctx.lineWidth = 14;
            ctx.strokeRect(-7, -7, WORLD_WIDTH + 14, WORLD_HEIGHT + 14);

            // Neon perimeter boundary
            ctx.strokeStyle = '#00a8ff';
            ctx.lineWidth = 4;
            ctx.strokeRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

            // Corner decorative brackets
            let bracketLen = 40;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3.5;
            // Top-Left
            ctx.beginPath(); ctx.moveTo(0, bracketLen); ctx.lineTo(0, 0); ctx.lineTo(bracketLen, 0); ctx.stroke();
            // Top-Right
            ctx.beginPath(); ctx.moveTo(WORLD_WIDTH - bracketLen, 0); ctx.lineTo(WORLD_WIDTH, 0); ctx.lineTo(WORLD_WIDTH, bracketLen); ctx.stroke();
            // Bottom-Left
            ctx.beginPath(); ctx.moveTo(0, WORLD_HEIGHT - bracketLen); ctx.lineTo(0, WORLD_HEIGHT); ctx.lineTo(bracketLen, WORLD_HEIGHT); ctx.stroke();
            // Bottom-Right
            ctx.beginPath(); ctx.moveTo(WORLD_WIDTH - bracketLen, WORLD_HEIGHT); ctx.lineTo(WORLD_WIDTH, WORLD_HEIGHT); ctx.lineTo(WORLD_WIDTH, WORLD_HEIGHT - bracketLen); ctx.stroke();

            // Boundary Badges
            ctx.fillStyle = 'rgba(0, 168, 255, 0.9)';
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('⚡ CITY LIMITS (PLAYABLE REGION) ⚡', WORLD_WIDTH / 2, -14);
            ctx.fillText('⚡ CITY LIMITS ⚡', WORLD_WIDTH / 2, WORLD_HEIGHT + 24);
            ctx.restore();

            missingPathLines.forEach(l => {
                ctx.save();
                ctx.strokeStyle = `rgba(255, 71, 87, ${l.life / 90})`;
                ctx.lineWidth = 2;
                ctx.setLineDash([8, 8]);
                ctx.beginPath();
                ctx.moveTo(l.x1, l.y1);
                ctx.lineTo(l.x2, l.y2);
                ctx.stroke();
                ctx.restore();
            });

            edges.forEach(e => {
                let style = ROAD_TYPES[e.type];
                ctx.strokeStyle = style.color;
                ctx.lineWidth = style.width;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(e.from.x, e.from.y);
                ctx.lineTo(e.to.x, e.to.y);
                ctx.stroke();

                let dx = e.to.x - e.from.x;
                let dy = e.to.y - e.from.y;
                let len = Math.hypot(dx, dy);
                if (len > 0) {
                    let nx = dy / len;
                    let ny = -dx / len;

                    // Heatmap: Multi-layer gradient glow along road edges
                    if (showHeatmap && e.congestion > 3) {
                        ctx.save();
                        let congRatio = Math.min(1.0, e.congestion / 100);
                        // Rich 5-stop color ramp: green -> lime -> yellow -> orange -> red
                        let r, g, b;
                        if (congRatio < 0.25) {
                            let t = congRatio / 0.25;
                            r = Math.round(30 + t * 195); g = 220; b = 30;
                        } else if (congRatio < 0.5) {
                            let t = (congRatio - 0.25) / 0.25;
                            r = Math.round(225 + t * 30); g = Math.round(220 - t * 80); b = 0;
                        } else if (congRatio < 0.75) {
                            let t = (congRatio - 0.5) / 0.25;
                            r = 255; g = Math.round(140 - t * 100); b = 0;
                        } else {
                            let t = (congRatio - 0.75) / 0.25;
                            r = 255; g = Math.round(40 - t * 40); b = Math.round(t * 30);
                        }
                        let color = `rgb(${r},${g},${b})`;
                        let baseAlpha = 0.18 + (congRatio * 0.72);
                        let roadHalfW = style.width / 2;

                        // Layer 1: Wide ambient outer glow (full road width)
                        ctx.globalCompositeOperation = 'screen';
                        let gradOuter = ctx.createLinearGradient(
                            e.from.x - nx * roadHalfW, e.from.y - ny * roadHalfW,
                            e.from.x + nx * roadHalfW, e.from.y + ny * roadHalfW
                        );
                        gradOuter.addColorStop(0, `rgba(${r},${g},${b},0)`);
                        gradOuter.addColorStop(0.25, `rgba(${r},${g},${b},${baseAlpha * 0.28})`);
                        gradOuter.addColorStop(0.5, `rgba(${r},${g},${b},${baseAlpha * 0.40})`);
                        gradOuter.addColorStop(0.75, `rgba(${r},${g},${b},${baseAlpha * 0.28})`);
                        gradOuter.addColorStop(1, `rgba(${r},${g},${b},0)`);
                        ctx.strokeStyle = gradOuter;
                        ctx.lineWidth = style.width - 2;
                        ctx.lineCap = 'round';
                        ctx.beginPath();
                        ctx.moveTo(e.from.x, e.from.y);
                        ctx.lineTo(e.to.x, e.to.y);
                        ctx.stroke();

                        // Layer 2: Medium shoulder strips along both curbs
                        ctx.globalCompositeOperation = 'source-over';
                        let shoulderOff = roadHalfW - 2;
                        ctx.strokeStyle = `rgba(${r},${g},${b},${baseAlpha * 0.45})`;
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.moveTo(e.from.x - nx * shoulderOff, e.from.y - ny * shoulderOff);
                        ctx.lineTo(e.to.x - nx * shoulderOff, e.to.y - ny * shoulderOff);
                        ctx.moveTo(e.from.x + nx * shoulderOff, e.from.y + ny * shoulderOff);
                        ctx.lineTo(e.to.x + nx * shoulderOff, e.to.y + ny * shoulderOff);
                        ctx.stroke();

                        // Layer 3: Crisp bright inner curb line
                        ctx.strokeStyle = `rgba(${r},${g},${b},${baseAlpha * 0.65})`;
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.moveTo(e.from.x - nx * shoulderOff, e.from.y - ny * shoulderOff);
                        ctx.lineTo(e.to.x - nx * shoulderOff, e.to.y - ny * shoulderOff);
                        ctx.moveTo(e.from.x + nx * shoulderOff, e.from.y + ny * shoulderOff);
                        ctx.lineTo(e.to.x + nx * shoulderOff, e.to.y + ny * shoulderOff);
                        ctx.stroke();

                        ctx.globalCompositeOperation = 'source-over';
                        ctx.restore();
                    }

                    ctx.strokeStyle = style.line;
                    ctx.lineWidth = 2;
                    ctx.setLineDash(e.type === 'highway' ? [12, 6] : [6, 6]);
                    ctx.beginPath();
                    ctx.moveTo(e.from.x, e.from.y);
                    ctx.lineTo(e.to.x, e.to.y);
                    ctx.stroke();

                    if (style.lanesPerDir > 1) {
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
                        ctx.lineWidth = 1;
                        ctx.setLineDash([4, 4]);

                        for (let dir = -1; dir <= 1; dir += 2) {
                            for (let l = 1; l < style.lanesPerDir; l++) {
                                let offset = dir * (7 * l);
                                ctx.beginPath();
                                ctx.moveTo(e.from.x + nx * offset, e.from.y + ny * offset);
                                ctx.lineTo(e.to.x + nx * offset, e.to.y + ny * offset);
                                ctx.stroke();
                            }
                        }
                    }
                    ctx.setLineDash([]);
                }
            });

            if (dragStartNode) {
                let targetNode = getStraightTargetNode(dragStartNode, mousePos.x, mousePos.y);
                if (currentTool in ROAD_TYPES) {
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
                    ctx.lineWidth = ROAD_TYPES[currentTool].width;
                    ctx.beginPath();
                    ctx.moveTo(dragStartNode.x, dragStartNode.y);
                    ctx.lineTo(targetNode.x, targetNode.y);
                    ctx.stroke();
                } else if (currentTool === 'delete') {
                    ctx.save();
                    ctx.strokeStyle = 'rgba(231, 76, 60, 0.7)';
                    ctx.lineWidth = 26;
                    ctx.setLineDash([8, 6]);
                    ctx.beginPath();
                    ctx.moveTo(dragStartNode.x, dragStartNode.y);
                    ctx.lineTo(targetNode.x, targetNode.y);
                    ctx.stroke();
                    ctx.restore();
                } else if (currentTool === 'upgrade') {
                    ctx.save();
                    ctx.strokeStyle = 'rgba(0, 206, 201, 0.75)';
                    ctx.lineWidth = 28;
                    ctx.setLineDash([10, 6]);
                    ctx.beginPath();
                    ctx.moveTo(dragStartNode.x, dragStartNode.y);
                    ctx.lineTo(targetNode.x, targetNode.y);
                    ctx.stroke();
                    ctx.restore();
                } else if (currentTool === 'downgrade') {
                    ctx.save();
                    ctx.strokeStyle = 'rgba(243, 156, 18, 0.75)';
                    ctx.lineWidth = 28;
                    ctx.setLineDash([10, 6]);
                    ctx.beginPath();
                    ctx.moveTo(dragStartNode.x, dragStartNode.y);
                    ctx.lineTo(targetNode.x, targetNode.y);
                    ctx.stroke();
                    ctx.restore();
                }
            }

            nodes.forEach(n => {
                if (n.type === 'roundabout') {
                    let specs = getRoundaboutSpecs(n);

                    // Heatmap: color the ring based on how many cars are circulating
                    if (showHeatmap) {
                        let carsInRing = cars.filter(c => c.inRoundabout && c.roundaboutCenter === n).length;
                        let ringCapacity = specs.lanes * 4;
                        let congRatio = Math.min(1.0, carsInRing / Math.max(1, ringCapacity));
                        if (congRatio > 0.05) {
                            let r, g, b;
                            if (congRatio < 0.33) {
                                let t = congRatio / 0.33;
                                r = Math.round(30 + t * 195); g = 220; b = 30;
                            } else if (congRatio < 0.66) {
                                let t = (congRatio - 0.33) / 0.33;
                                r = 255; g = Math.round(220 - t * 180); b = 0;
                            } else {
                                let t = (congRatio - 0.66) / 0.34;
                                r = 255; g = Math.round(40 - t * 40); b = 0;
                            }
                            ctx.save();
                            ctx.globalCompositeOperation = 'screen';
                            let heatGrad = ctx.createRadialGradient(n.x, n.y, specs.radius - specs.lanes * 7, n.x, n.y, specs.radius + 10);
                            heatGrad.addColorStop(0, `rgba(${r},${g},${b},0)`);
                            heatGrad.addColorStop(0.4, `rgba(${r},${g},${b},${0.25 + congRatio * 0.5})`);
                            heatGrad.addColorStop(0.75, `rgba(${r},${g},${b},${0.18 + congRatio * 0.35})`);
                            heatGrad.addColorStop(1, `rgba(${r},${g},${b},0)`);
                            ctx.fillStyle = heatGrad;
                            ctx.beginPath();
                            ctx.arc(n.x, n.y, specs.radius + 10, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.globalCompositeOperation = 'source-over';
                            ctx.restore();
                        }
                    }

                    ctx.fillStyle = '#2c3e50';
                    ctx.beginPath(); ctx.arc(n.x, n.y, specs.radius + 8, 0, Math.PI * 2); ctx.fill();

                    ctx.fillStyle = '#47693e';
                    ctx.beginPath(); ctx.arc(n.x, n.y, specs.radius - (specs.lanes * 7), 0, Math.PI * 2); ctx.fill();

                    if (specs.lanes > 1) {
                        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
                        ctx.lineWidth = 1;
                        ctx.setLineDash([4, 4]);
                        for (let l = 1; l < specs.lanes; l++) {
                            ctx.beginPath();
                            ctx.arc(n.x, n.y, specs.radius - (l * 7), 0, Math.PI * 2);
                            ctx.stroke();
                        }
                        ctx.setLineDash([]);
                    }
                } else if (n.type === 'signal') {
                    ctx.fillStyle = '#1e272e';
                    ctx.beginPath(); ctx.arc(n.x, n.y, 10, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = (n.signalState === 'NS_GREEN') ? '#2ecc71' : '#e74c3c';
                    ctx.fillRect(n.x - 3, n.y - 14, 6, 6);
                    ctx.fillRect(n.x - 3, n.y + 8, 6, 6);
                    ctx.fillStyle = (n.signalState === 'EW_GREEN') ? '#2ecc71' : '#e74c3c';
                    ctx.fillRect(n.x - 14, n.y - 3, 6, 6);
                    ctx.fillRect(n.x + 8, n.y - 3, 6, 6);
                } else if (n.type === 'stopsign') {
                    ctx.fillStyle = '#e74c3c';
                    ctx.beginPath();
                    ctx.arc(n.x, n.y, 7, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 8px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('STOP', n.x, n.y + 3);
                }
            });

            hubs.forEach(h => {
                let connected = isHubConnected(h);
                drawHub(ctx, h, connected);
            });

            let timeInfo = getGameTimeInfo();
            let isNight = (timeInfo.hours24 < 6 || timeInfo.hours24 >= 20);
            let isDusk = (timeInfo.hours24 >= 17 && timeInfo.hours24 < 20);

            cars.forEach(c => {
                ctx.save();
                ctx.translate(c.x, c.y);
                ctx.rotate(c.angle || 0);

                // Car Headlight beams shining at night/dusk
                if (isNight || isDusk) {
                    let beamGrad = ctx.createRadialGradient(6, 0, 1, 24, 0, 18);
                    beamGrad.addColorStop(0, 'rgba(255, 245, 170, 0.45)');
                    beamGrad.addColorStop(1, 'rgba(255, 245, 170, 0)');
                    ctx.fillStyle = beamGrad;
                    ctx.beginPath();
                    ctx.moveTo(6, -3);
                    ctx.lineTo(26, -10);
                    ctx.lineTo(26, 10);
                    ctx.lineTo(6, 3);
                    ctx.closePath();
                    ctx.fill();
                }

                // Car Body & Windshield
                ctx.fillStyle = c.color;
                ctx.fillRect(-6, -3, 12, 6);
                ctx.fillStyle = '#fff';
                ctx.fillRect(5, -2.5, 2, 1.2);
                ctx.fillRect(5, 1.3, 2, 1.2);
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(-1, -2.5, 4, 5); // roof glass

                ctx.restore();
            });

            // Ambient Day / Dusk / Night Environmental Lighting Tint
            if (isNight) {
                ctx.save();
                ctx.fillStyle = 'rgba(10, 18, 36, 0.22)';
                ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
                ctx.restore();
            } else if (isDusk) {
                ctx.save();
                ctx.fillStyle = 'rgba(230, 126, 34, 0.08)';
                ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
                ctx.restore();
            }

            floatingTexts.forEach(ft => {
                ctx.save();
                ctx.globalAlpha = ft.opacity;
                ctx.fillStyle = ft.color;
                ctx.font = 'bold 13px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            });

            ctx.restore();

            requestAnimationFrame(() => { update(); draw(); });
        }

        window.addEventListener('resize', () => {
            resize();
        });

        window.onload = () => {
            initGame();
            draw();
        };
    </script>
</body>
