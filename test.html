<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Highways & Co. - Web Simulator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0e1216; font-family: 'Segoe UI', system-ui, sans-serif; }
        #canvas { display: block; width: 100vw; height: 100vh; background: #0e1216; cursor: crosshair; }
        
        #top-bar {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(18, 21, 25, 0.95); padding: 12px 26px; border-radius: 30px;
            display: flex; gap: 24px; align-items: center; box-shadow: 0 8px 32px rgba(0,0,0,0.55);
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.12); z-index: 10;
        }
        .stat-item { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; color: #fff; }
        .stat-val { color: #2ecc71; font-weight: 700; font-size: 15px; }

        #toolbar {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(18, 21, 25, 0.95); padding: 10px 12px; border-radius: 18px;
            display: flex; gap: 9px; box-shadow: 0 8px 32px rgba(0,0,0,0.55);
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.12); z-index: 10;
        }
        .btn {
            background: #252a2e; border: 2px solid #38414a; color: #f0f0f0;
            padding: 9px 15px; border-radius: 11px; cursor: pointer; font-size: 13.5px;
            font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 3px;
            transition: all 0.15s ease;
        }
        .btn:hover { background: #38414a; border-color: #00a8ff; color: #fff; }
        .btn.active { background: #00a8ff; border-color: #0097e6; color: #fff; box-shadow: 0 0 14px rgba(0, 168, 255, 0.45); }
        .btn .cost { font-size: 11.5px; opacity: 0.9; font-weight: 600; color: #dcdde1; }

        .traffic-slider-wrap {
            display: flex; flex-direction: column; gap: 4px; border-left: 1px solid rgba(255,255,255,0.12); padding-left: 16px; color: #fff;
        }
        .traffic-slider-wrap label { font-size: 12.5px; opacity: 0.95; font-weight: 600; }
        .traffic-slider-wrap input { width: 130px; cursor: pointer; }

        #zoom-controls {
            position: absolute; right: 20px; bottom: 20px;
            background: rgba(18, 21, 25, 0.95); padding: 6px; border-radius: 14px;
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.55); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.12); z-index: 10;
        }
        .zoom-btn {
            width: 38px; height: 38px; background: #252a2e; border: 1px solid #38414a;
            color: #fff; border-radius: 10px; cursor: pointer; display: flex;
            align-items: center; justify-content: center; font-size: 15px;
            font-weight: bold; transition: all 0.15s ease;
        }
        .zoom-btn:hover { background: #00a8ff; border-color: #0097e6; }
        #zoom-level { font-size: 12.5px; font-weight: 700; color: #00a8ff; padding: 2px 0; }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="stat-item" id="clock-widget" title="Current simulated city time and commuter rush cycle" style="background: rgba(0,0,0,0.38); padding: 5px 12px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; align-items: flex-start; gap: 2px;">
            <div style="display: flex; align-items: center; gap: 7px;">
                <span id="time-display" style="font-weight: 700; color: #f5cd79; font-size: 14px;">🕒 07:00 AM</span>
                <span id="rush-badge" style="font-size: 11px; font-weight: bold; padding: 2px 7px; border-radius: 4px; background: rgba(230, 126, 34, 0.25); color: #f39c12; border: 1px solid rgba(230, 126, 34, 0.4);">🌅 Morning Rush</span>
            </div>
            <span id="commute-desc" style="font-size: 11.5px; color: rgba(255,255,255,0.85); font-weight: 600;">🏡 Towns ➔ 🏢 Work (85%)</span>
        </div>
        <div class="stat-item">Budget: <span id="budget-val" class="stat-val">$5,000</span></div>
        <div class="stat-item">Road Upkeep: <span id="upkeep-val" style="color:#e67e22">-$0 / 10s</span></div>
        <div class="stat-item">Active Traffic: <span id="cars-val" style="color:#f1c40f">0</span></div>
        <div class="stat-item">🏡 Towns: <span id="towns-val" style="color:#e74c3c">0</span></div>
        <div class="stat-item">🏢 Jobs: <span id="jobs-val" style="color:#00a8ff">0</span></div>
        <div class="traffic-slider-wrap">
            <label>Traffic Demand Scale: <b id="rate-label" style="color:#00a8ff">5x</b></label>
            <input type="range" id="traffic-rate" min="1" max="25" value="5" step="1">
        </div>
    </div>

    <div id="toolbar">
        <button class="btn active" id="btn-local" onclick="setTool('local')">
            🏡 Local (2-Lane 2-Way)
            <span class="cost">$40 • Upkeep $1/10s</span>
        </button>
        <button class="btn" id="btn-avenue" onclick="setTool('avenue')">
            🛣️ Avenue (4-Lane 2-Way)
            <span class="cost">$100 • Upkeep $4/10s</span>
        </button>
        <button class="btn" id="btn-highway" onclick="setTool('highway')">
            🌉 Highway (6-Lane 2-Way)
            <span class="cost">$250 • Upkeep $10/10s</span>
        </button>
        <button class="btn" id="btn-signal" onclick="setTool('signal')">
            🚦 Traffic Light
            <span class="cost">$300 • Upkeep $5/10s</span>
        </button>
        <button class="btn" id="btn-roundabout" onclick="setTool('roundabout')">
            🔄 Roundabout
            <span class="cost">$600 • Upkeep $5/10s</span>
        </button>
        <button class="btn" id="btn-upgrade" onclick="setTool('upgrade')">
            ⬆️ Upgrade Tier
            <span class="cost">Local ➔ Ave ➔ Hwy</span>
        </button>
        <button class="btn" id="btn-downgrade" onclick="setTool('downgrade')">
            ⬇️ Downgrade Tier
            <span class="cost">Hwy ➔ Ave ➔ Local</span>
        </button>
        <button class="btn" id="btn-heatmap" onclick="toggleHeatmap()">
            🔥 Heatmap Mode
            <span class="cost" id="heat-status">OFF</span>
        </button>
        <button class="btn" id="btn-delete" onclick="setTool('delete')">
            🗑️ Demolish
            <span class="cost">+$20 refund</span>
        </button>
    </div>

    <div id="zoom-controls">
        <button class="zoom-btn" onclick="zoomIn()" title="Zoom In">➕</button>
        <div id="zoom-level">85%</div>
        <button class="zoom-btn" onclick="zoomOut()" title="Zoom Out">➖</button>
        <button class="zoom-btn" onclick="resetZoom()" title="Reset / Fit View">🎯</button>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let budget = 5000;
        let currentTool = 'local';
        let nodes = [];
        let edges = [];
        let cars = [];
        let hubs = [];
        let floatingTexts = [];
        let missingPathLines = [];
        let dragStartNode = null;
        let mousePos = { x: 0, y: 0 };
        let spawnMultiplier = 5;
        let nextHubTimer = 0;
        let upkeepTimer = 0;
        let showHeatmap = false;
        let gameMinutes = 7 * 60; // Start at 7:00 AM

        function getGameTimeInfo() {
            let totalMins = Math.floor(gameMinutes) % 1440;
            let hours24 = Math.floor(totalMins / 60);
            let mins = totalMins % 60;
            let period = hours24 >= 12 ? 'PM' : 'AM';
            let hours12 = hours24 % 12 || 12;
            let timeStr = `${hours12.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')} ${period}`;

            let phase = 'Midday Mix';
            let phaseIcon = '☀️';
            let phaseBadgeBg = 'rgba(46, 204, 113, 0.22)';
            let phaseColor = '#2ecc71';
            let phaseBorder = 'rgba(46, 204, 113, 0.4)';
            let flowDesc = '🔄 50/50 Mixed Errands';
            let tooltip = 'Midday Traffic: Balanced bidirectional flow (50% to jobs / 50% returning) for errands & shifts.';
            let toJobProbability = 0.50; // 50/50 mix
            let rushMultiplier = 1.0;

            if (hours24 >= 6 && hours24 < 10) {
                phase = 'Morning Rush';
                phaseIcon = '🌅';
                phaseBadgeBg = 'rgba(230, 126, 34, 0.25)';
                phaseColor = '#f39c12';
                phaseBorder = 'rgba(230, 126, 34, 0.45)';
                flowDesc = '🏡 Towns ➔ 🏢 Work (85%)';
                tooltip = 'Morning Rush: 85% of traffic flows from Towns to Workplaces (+40% traffic demand).';
                toJobProbability = 0.85; // 85% Town -> Job
                rushMultiplier = 1.4;
            } else if (hours24 >= 10 && hours24 < 16) {
                phase = 'Midday Traffic';
                phaseIcon = '☀️';
                phaseBadgeBg = 'rgba(52, 152, 219, 0.22)';
                phaseColor = '#3498db';
                phaseBorder = 'rgba(52, 152, 219, 0.4)';
                flowDesc = '🔄 50/50 Mixed Flow';
                tooltip = 'Midday Traffic: Balanced flow between residential and commercial centers for errands & deliveries.';
                toJobProbability = 0.50; // 50/50 mix
                rushMultiplier = 1.0;
            } else if (hours24 >= 16 && hours24 < 20) {
                phase = 'Evening Rush';
                phaseIcon = '🌆';
                phaseBadgeBg = 'rgba(155, 89, 182, 0.28)';
                phaseColor = '#e056fd';
                phaseBorder = 'rgba(155, 89, 182, 0.5)';
                flowDesc = '🏢 Work ➔ 🏡 Towns (85%)';
                tooltip = 'Evening Rush: 85% of traffic flows from Workplaces returning home to Towns (+40% traffic demand).';
                toJobProbability = 0.15; // 85% Job -> Town (only 15% Town -> Job)
                rushMultiplier = 1.4;
            } else {
                phase = 'Night Commute';
                phaseIcon = '🌙';
                phaseBadgeBg = 'rgba(52, 73, 94, 0.4)';
                phaseColor = '#bdc3c7';
                phaseBorder = 'rgba(127, 140, 141, 0.4)';
                flowDesc = '🏡 Returning Home (70%)';
                tooltip = 'Night Commute: Lighter traffic with late-shift workers mostly returning home to Towns (70%).';
                toJobProbability = 0.30; // 70% Job -> Town, 30% Town -> Job
                rushMultiplier = 0.75;
            }

            return { totalMins, hours24, mins, timeStr, phase, phaseIcon, phaseBadgeBg, phaseColor, phaseBorder, flowDesc, tooltip, toJobProbability, rushMultiplier };
        }

        const GRID = 40;
        const WORLD_WIDTH = 2200;
        const WORLD_HEIGHT = 1500;

        let camera = { x: 1100, y: 750, zoom: 0.85, minZoom: 0.35, maxZoom: 2.5 };
        let isPanning = false;
        let panStartX = 0;
        let panStartY = 0;
        let camStartX = 0;
        let camStartY = 0;

        const ROAD_TYPES = {
            local: { lanes: 2, lanesPerDir: 1, width: 20, speedLimit: 2.2, cost: 40, upkeep: 1, color: '#34495e', line: '#f1c40f' },
            avenue: { lanes: 4, lanesPerDir: 2, width: 34, speedLimit: 3.6, cost: 100, upkeep: 4, color: '#2c3e50', line: '#ffffff' },
            highway: { lanes: 6, lanesPerDir: 3, width: 48, speedLimit: 5.5, cost: 250, upkeep: 10, color: '#1a252f', line: '#e67e22' }
        };

        const JOB_COLORS = ['#3498db', '#9b59b6', '#e67e22', '#1abc9c', '#e74c3c', '#fd79a8', '#00cec9'];
        const TOWN_COLORS = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff', '#5f27cd', '#00d2d3', '#ff9f43', '#10ac84', '#ee5a24'];

        function resize() {
            canvas.width = window.innerWidth || document.documentElement.clientWidth || 1024;
            canvas.height = window.innerHeight || document.documentElement.clientHeight || 768;
        }

        function screenToWorld(sx, sy) {
            return {
                x: (sx - canvas.width / 2) / camera.zoom + camera.x,
                y: (sy - canvas.height / 2) / camera.zoom + camera.y
            };
        }

        function worldToScreen(wx, wy) {
            return {
                x: (wx - camera.x) * camera.zoom + canvas.width / 2,
                y: (wy - camera.y) * camera.zoom + canvas.height / 2
            };
        }

        function setZoomAtScreenPoint(sx, sy, targetZoom) {
            let clampedZoom = Math.max(camera.minZoom, Math.min(camera.maxZoom, targetZoom));
            let mouseBefore = screenToWorld(sx, sy);
            camera.zoom = clampedZoom;
            let mouseAfter = screenToWorld(sx, sy);
            camera.x += (mouseBefore.x - mouseAfter.x);
            camera.y += (mouseBefore.y - mouseAfter.y);
            updateUI();
        }

        function zoomIn() {
            setZoomAtScreenPoint(canvas.width / 2, canvas.height / 2, camera.zoom * 1.25);
        }

        function zoomOut() {
            setZoomAtScreenPoint(canvas.width / 2, canvas.height / 2, camera.zoom / 1.25);
        }

        function resetZoom() {
            camera.x = WORLD_WIDTH / 2;
            camera.y = WORLD_HEIGHT / 2;
            camera.zoom = Math.max(0.45, Math.min(1.0, Math.min(canvas.width / (WORLD_WIDTH + 80), canvas.height / (WORLD_HEIGHT + 80))));
            updateUI();
        }

        function snap(val, maxBound = Infinity) {
            let snapped = Math.round(val / GRID) * GRID;
            return Math.max(0, Math.min(maxBound, snapped));
        }

        function addFloatingText(x, y, text, color) {
            floatingTexts.push({ x, y, text, color, opacity: 1.0, life: 60 });
        }

        function resolveNodeFromCoords(x, y) {
            let clX = Math.max(0, Math.min(WORLD_WIDTH, x));
            let clY = Math.max(0, Math.min(WORLD_HEIGHT, y));
            let nearbyHub = hubs.find(h => Math.hypot(h.x - clX, h.y - clY) <= 22);
            if (nearbyHub) {
                return findOrCreateNode(nearbyHub.x, nearbyHub.y);
            }
            return findOrCreateNode(snap(clX, WORLD_WIDTH), snap(clY, WORLD_HEIGHT));
        }

        function findOrCreateNode(sx, sy) {
            let clX = Math.max(0, Math.min(WORLD_WIDTH, sx));
            let clY = Math.max(0, Math.min(WORLD_HEIGHT, sy));
            let n = nodes.find(n => n.x === clX && n.y === clY);
            if (n) return n;

            let newNode = { 
                id: nodes.length + 1, 
                x: clX, 
                y: clY, 
                type: 'none',
                signalState: 'NS_GREEN',
                signalTimer: 0
            };
            nodes.push(newNode);
            return newNode;
        }

        function getStraightTargetNode(startNode, mouseX, mouseY) {
            let dx = mouseX - startNode.x;
            let dy = mouseY - startNode.y;

            if (Math.abs(dx) >= Math.abs(dy)) {
                // Strict Horizontal lock (target Y === startNode.y)
                let targetX = snap(mouseX);
                // Only snap to a hub if that hub is on the EXACT same horizontal row
                let rowHub = hubs.find(h => h.y === startNode.y && Math.abs(h.x - mouseX) <= 22);
                if (rowHub) targetX = rowHub.x;
                return findOrCreateNode(targetX, startNode.y);
            } else {
                // Strict Vertical lock (target X === startNode.x)
                let targetY = snap(mouseY);
                // Only snap to a hub if that hub is on the EXACT same vertical column
                let colHub = hubs.find(h => h.x === startNode.x && Math.abs(h.y - mouseY) <= 22);
                if (colHub) targetY = colHub.y;
                return findOrCreateNode(startNode.x, targetY);
            }
        }

        function getHub(node) {
            return hubs.find(h => h.x === node.x && h.y === node.y);
        }

        function addEdgeSegment(nodeA, nodeB, roadType) {
            if (nodeA === nodeB) return false;
            // Never add diagonal edge segments
            if (nodeA.x !== nodeB.x && nodeA.y !== nodeB.y) return false;

            let existingIndex = edges.findIndex(e => (e.from === nodeA && e.to === nodeB) || (e.from === nodeB && e.to === nodeA));
            if (existingIndex !== -1) {
                edges[existingIndex].type = roadType;
                return false;
            }

            // Enforce max 1 road connection per town and per workplace
            let hubA = getHub(nodeA);
            if (hubA) {
                let connectedA = edges.filter(e => e.from === nodeA || e.to === nodeA);
                if (connectedA.length >= 1) {
                    let label = hubA.isSpawn ? 'Town Max 1 Road!' : 'Workplace Max 1 Road!';
                    addFloatingText(nodeA.x, nodeA.y - 18, label, '#e74c3c');
                    return false;
                }
            }

            let hubB = getHub(nodeB);
            if (hubB) {
                let connectedB = edges.filter(e => e.from === nodeB || e.to === nodeB);
                if (connectedB.length >= 1) {
                    let label = hubB.isSpawn ? 'Town Max 1 Road!' : 'Workplace Max 1 Road!';
                    addFloatingText(nodeB.x, nodeB.y - 18, label, '#e74c3c');
                    return false;
                }
            }

            edges.push({ from: nodeA, to: nodeB, type: roadType, congestion: 0 });
            return true;
        }

        function buildRoadPath(startNode, endNode, roadType) {
            // Absolute rejection of any diagonal path
            if (startNode.x !== endNode.x && startNode.y !== endNode.y) return 0;

            let dx = endNode.x - startNode.x;
            let dy = endNode.y - startNode.y;
            let steps = Math.max(Math.abs(dx), Math.abs(dy)) / GRID;
            
            if (steps === 0) return 0;

            let stepX = dx / steps;
            let stepY = dy / steps;

            let current = startNode;
            let addedCount = 0;

            for (let i = 1; i <= steps; i++) {
                let nextX = Math.round(startNode.x + stepX * i);
                let nextY = Math.round(startNode.y + stepY * i);
                let nextNode = findOrCreateNode(nextX, nextY);

                if (addEdgeSegment(current, nextNode, roadType)) {
                    addedCount++;
                    current = nextNode;
                } else {
                    let isUpgrade = edges.some(e => (e.from === current && e.to === nextNode) || (e.from === nextNode && e.to === current));
                    if (isUpgrade) {
                        current = nextNode;
                    } else {
                        break;
                    }
                }
            }

            updateNodeTypes();
            return addedCount;
        }

        function demolishStraightPath(startNode, endNode) {
            if (startNode.x !== endNode.x && startNode.y !== endNode.y) return 0;

            let dx = endNode.x - startNode.x;
            let dy = endNode.y - startNode.y;
            let steps = Math.max(Math.abs(dx), Math.abs(dy)) / GRID;
            if (steps === 0) return 0;
            let stepX = dx / steps;
            let stepY = dy / steps;

            let deletedEdgesCount = 0;
            let current = startNode;

            for (let i = 1; i <= steps; i++) {
                let nextX = Math.round(startNode.x + stepX * i);
                let nextY = Math.round(startNode.y + stepY * i);
                let nextNode = nodes.find(n => n.x === nextX && n.y === nextY);
                if (nextNode) {
                    let edgeIdx = edges.findIndex(e => (e.from === current && e.to === nextNode) || (e.from === nextNode && e.to === current));
                    if (edgeIdx !== -1) {
                        edges.splice(edgeIdx, 1);
                        deletedEdgesCount++;
                    }
                    current = nextNode;
                }
            }

            // Remove non-hub nodes that now have 0 connected edges
            nodes = nodes.filter(n => {
                let isHub = hubs.some(h => h.x === n.x && h.y === n.y);
                if (isHub) return true;
                return edges.some(e => e.from === n || e.to === n);
            });

            // Remove stranded cars on deleted edges
            cars = cars.filter(c => {
                let hasEdge = edges.some(e => (e.from === c.currentNode && e.to === c.nextNode) || (e.from === c.nextNode && e.to === c.currentNode));
                return hasEdge || c.inRoundabout;
            });

            updateNodeTypes();
            return deletedEdgesCount;
        }

        function upgradeStraightPath(startNode, endNode) {
            if (startNode.x !== endNode.x && startNode.y !== endNode.y) return { count: 0, cost: 0 };

            let dx = endNode.x - startNode.x;
            let dy = endNode.y - startNode.y;
            let steps = Math.max(Math.abs(dx), Math.abs(dy)) / GRID;
            if (steps === 0) return { count: 0, cost: 0 };
            let stepX = dx / steps;
            let stepY = dy / steps;

            let upgradedCount = 0;
            let totalCost = 0;
            let current = startNode;

            for (let i = 1; i <= steps; i++) {
                let nextX = Math.round(startNode.x + stepX * i);
                let nextY = Math.round(startNode.y + stepY * i);
                let nextNode = nodes.find(n => n.x === nextX && n.y === nextY);
                if (nextNode) {
                    let edge = edges.find(e => (e.from === current && e.to === nextNode) || (e.from === nextNode && e.to === current));
                    if (edge) {
                        if (edge.type === 'local') {
                            edge.type = 'avenue';
                            upgradedCount++;
                            totalCost += (ROAD_TYPES.avenue.cost - ROAD_TYPES.local.cost);
                        } else if (edge.type === 'avenue') {
                            edge.type = 'highway';
                            upgradedCount++;
                            totalCost += (ROAD_TYPES.highway.cost - ROAD_TYPES.avenue.cost);
                        }
                    }
                    current = nextNode;
                }
            }

            updateNodeTypes();
            return { count: upgradedCount, cost: totalCost };
        }

        function downgradeStraightPath(startNode, endNode) {
            if (startNode.x !== endNode.x && startNode.y !== endNode.y) return { count: 0, refund: 0 };

            let dx = endNode.x - startNode.x;
            let dy = endNode.y - startNode.y;
            let steps = Math.max(Math.abs(dx), Math.abs(dy)) / GRID;
            if (steps === 0) return { count: 0, refund: 0 };
            let stepX = dx / steps;
            let stepY = dy / steps;

            let downgradedCount = 0;
            let totalRefund = 0;
            let current = startNode;

            for (let i = 1; i <= steps; i++) {
                let nextX = Math.round(startNode.x + stepX * i);
                let nextY = Math.round(startNode.y + stepY * i);
                let nextNode = nodes.find(n => n.x === nextX && n.y === nextY);
                if (nextNode) {
                    let edge = edges.find(e => (e.from === current && e.to === nextNode) || (e.from === nextNode && e.to === current));
                    if (edge) {
                        if (edge.type === 'highway') {
                            edge.type = 'avenue';
                            downgradedCount++;
                            totalRefund += (ROAD_TYPES.highway.cost - ROAD_TYPES.avenue.cost);
                        } else if (edge.type === 'avenue') {
                            edge.type = 'local';
                            downgradedCount++;
                            totalRefund += (ROAD_TYPES.avenue.cost - ROAD_TYPES.local.cost);
                        }

                        let maxLanes = ROAD_TYPES[edge.type].lanesPerDir;
                        cars.forEach(c => {
                            let onThisSeg = (c.currentNode === current && c.nextNode === nextNode) || (c.currentNode === nextNode && c.nextNode === current);
                            if (onThisSeg && c.lane >= maxLanes) {
                                c.lane = maxLanes - 1;
                            }
                        });
                    }
                    current = nextNode;
                }
            }

            updateNodeTypes();
            return { count: downgradedCount, refund: totalRefund };
        }

        function updateNodeTypes() {
            nodes.forEach(n => {
                let isHub = hubs.some(h => h.x === n.x && h.y === n.y);
                if (isHub) {
                    n.type = 'none';
                    return;
                }
                if (n.type === 'signal' || n.type === 'roundabout') return;
                let connectedEdges = edges.filter(e => e.from === n || e.to === n);
                if (connectedEdges.length >= 3) {
                    n.type = 'stopsign';
                } else {
                    n.type = 'none';
                }
            });
        }

        function getRoundaboutSpecs(node) {
            let connected = edges.filter(e => e.from === node || e.to === node);
            let hasHighway = connected.some(e => e.type === 'highway');
            let hasAvenue = connected.some(e => e.type === 'avenue');

            if (hasHighway) return { lanes: 3, radius: 36 };
            if (hasAvenue) return { lanes: 2, radius: 28 };
            return { lanes: 1, radius: 20 };
        }

        function selectBestLane(fromNode, toNode, edge) {
            let totalLanes = ROAD_TYPES[edge.type].lanesPerDir;
            if (totalLanes <= 1) return 0;

            let laneCounts = new Array(totalLanes).fill(0);
            cars.forEach(c => {
                let sameSegment = (c.currentNode === fromNode && c.nextNode === toNode);
                if (sameSegment && c.lane < totalLanes) {
                    laneCounts[c.lane]++;
                }
            });

            let minCount = Math.min(...laneCounts);
            let candidates = [];
            laneCounts.forEach((cnt, idx) => {
                if (cnt === minCount) candidates.push(idx);
            });

            return candidates[Math.floor(Math.random() * candidates.length)];
        }

        function isHubConnected(hub) {
            let hubNode = nodes.find(n => n.x === hub.x && n.y === hub.y);
            if (!hubNode) return false;

            let validTargets = hubs.filter(h => h.isSpawn !== hub.isSpawn && h.timer <= 0);
            if (validTargets.length === 0) return false;

            for (let tHub of validTargets) {
                let targetNode = nodes.find(n => n.x === tHub.x && n.y === tHub.y);
                if (targetNode && findPath(hubNode, targetNode)) {
                    return true;
                }
            }
            return false;
        }

        function isValidHubLocation(hx, hy) {
            if (hx < 120 || hx > WORLD_WIDTH - 120 || hy < 120 || hy > WORLD_HEIGHT - 120) return false;

            let tooCloseToHub = hubs.some(h => Math.hypot(h.x - hx, h.y - hy) < 100);
            if (tooCloseToHub) return false;

            let tooCloseToRoad = nodes.some(n => Math.hypot(n.x - hx, n.y - hy) <= GRID + 5);
            if (tooCloseToRoad) return false;

            let tooCloseToEdge = edges.some(e => {
                let x1 = e.from.x, y1 = e.from.y, x2 = e.to.x, y2 = e.to.y;
                let A = hx - x1, B = hy - y1, C = x2 - x1, D = y2 - y1;
                let dot = A * C + B * D;
                let lenSq = C * C + D * D;
                let param = -1;
                if (lenSq !== 0) param = dot / lenSq;
                let xx, yy;
                if (param < 0) { xx = x1; yy = y1; }
                else if (param > 1) { xx = x2; yy = y2; }
                else { xx = x1 + param * C; yy = y1 + param * D; }
                return Math.hypot(hx - xx, hy - yy) <= GRID + 5;
            });

            return !tooCloseToEdge;
        }

        function createHub(x, y, isSpawn, gracePeriod = 20) {
            let colorIdx = hubs.filter(h => !h.isSpawn).length % JOB_COLORS.length;
            let hubX = snap(x, WORLD_WIDTH);
            let hubY = snap(y, WORLD_HEIGHT);

            if (!isValidHubLocation(hubX, hubY)) return false;

            let hubNode = findOrCreateNode(hubX, hubY);

            let townCount = hubs.filter(h => h.isSpawn).length;
            let jobCount = hubs.filter(h => !h.isSpawn).length;
            let hubNumber = isSpawn ? (townCount + 1) : (jobCount + 1);
            let hubColor = isSpawn
                ? TOWN_COLORS[townCount % TOWN_COLORS.length]
                : JOB_COLORS[jobCount % JOB_COLORS.length];

            let newHub = {
                id: hubs.length + 1,
                hubNumber: hubNumber,
                x: hubX,
                y: hubY,
                isSpawn: isSpawn,
                color: hubColor,
                name: isSpawn ? `Town #${hubNumber}` : `Job #${hubNumber}`,
                timer: gracePeriod
            };

            hubs.push(newHub);

            updateNodeTypes();
            updateUI();
            return true;
        }

        function initGame() {
            resize();
            nodes = [];
            edges = [];
            hubs = [];
            cars = [];
            floatingTexts = [];
            missingPathLines = [];

            camera.x = WORLD_WIDTH / 2;
            camera.y = WORLD_HEIGHT / 2;
            camera.zoom = Math.max(0.45, Math.min(1.0, Math.min(canvas.width / (WORLD_WIDTH + 80), canvas.height / (WORLD_HEIGHT + 80))));

            createHub(360, Math.max(200, WORLD_HEIGHT / 2 - 200), true, 20);
            createHub(360, Math.min(WORLD_HEIGHT - 200, WORLD_HEIGHT / 2 + 200), true, 20);
            createHub(WORLD_WIDTH - 360, Math.max(200, WORLD_HEIGHT / 2 - 200), false, 20);
            createHub(WORLD_WIDTH - 360, Math.min(WORLD_HEIGHT - 200, WORLD_HEIGHT / 2 + 200), false, 20);

            updateUI();
        }

        setInterval(() => {
            hubs.forEach(h => {
                if (h.timer > 0) h.timer--;
            });

            nodes.forEach(n => {
                if (n.type === 'signal') {
                    n.signalTimer++;

                    let connectedEdges = edges.filter(e => e.from === n || e.to === n);
                    let nsEdges = connectedEdges.filter(e => {
                        let other = (e.from === n ? e.to : e.from);
                        return Math.abs(other.y - n.y) >= Math.abs(other.x - n.x);
                    });
                    let ewEdges = connectedEdges.filter(e => {
                        let other = (e.from === n ? e.to : e.from);
                        return Math.abs(other.x - n.x) > Math.abs(other.y - n.y);
                    });

                    let nsMaxLanes = nsEdges.reduce((max, e) => Math.max(max, ROAD_TYPES[e.type]?.lanesPerDir || 1), 1);
                    let ewMaxLanes = ewEdges.reduce((max, e) => Math.max(max, ROAD_TYPES[e.type]?.lanesPerDir || 1), 1);

                    // Dynamic green phase duration based on road hierarchy: Local = 3s, Avenue = 6s, Highway = 9s
                    let nsDuration = nsMaxLanes === 3 ? 9 : (nsMaxLanes === 2 ? 6 : 3);
                    let ewDuration = ewMaxLanes === 3 ? 9 : (ewMaxLanes === 2 ? 6 : 3);

                    let currentLimit = (n.signalState === 'NS_GREEN') ? nsDuration : ewDuration;
                    if (n.signalTimer >= currentLimit) {
                        n.signalState = (n.signalState === 'NS_GREEN') ? 'EW_GREEN' : 'NS_GREEN';
                        n.signalTimer = 0;
                    }
                }
            });

            // Road & Intersection network maintenance upkeep tick (every 10s)
            upkeepTimer++;
            if (upkeepTimer >= 10) {
                upkeepTimer = 0;
                let roadUpkeep = edges.reduce((sum, e) => sum + (ROAD_TYPES[e.type]?.upkeep || 0), 0);
                let intersectionUpkeep = nodes.filter(n => n.type === 'signal' || n.type === 'roundabout').length * 5;
                let totalUpkeep = roadUpkeep + intersectionUpkeep;
                if (totalUpkeep > 0) {
                    budget -= totalUpkeep;
                    updateUI();
                }
            }
        }, 1000);

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            let btn = document.getElementById(`btn-${tool}`);
            if (btn) btn.classList.add('active');
        }

        function toggleHeatmap() {
            showHeatmap = !showHeatmap;
            let btn = document.getElementById('btn-heatmap');
            let status = document.getElementById('heat-status');
            btn.classList.toggle('active', showHeatmap);
            status.innerText = showHeatmap ? 'ON' : 'OFF';
        }

        document.getElementById('traffic-rate').addEventListener('input', (e) => {
            spawnMultiplier = parseInt(e.target.value);
            document.getElementById('rate-label').innerText = `${spawnMultiplier}x`;
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            let rect = canvas.getBoundingClientRect();
            let sx = e.clientX - rect.left;
            let sy = e.clientY - rect.top;
            let zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;
            setZoomAtScreenPoint(sx, sy, camera.zoom * zoomFactor);
        }, { passive: false });

        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        canvas.addEventListener('mousemove', (e) => {
            let rect = canvas.getBoundingClientRect();
            let sx = e.clientX - rect.left;
            let sy = e.clientY - rect.top;

            if (isPanning) {
                let dx = (sx - panStartX) / camera.zoom;
                let dy = (sy - panStartY) / camera.zoom;
                camera.x = camStartX - dx;
                camera.y = camStartY - dy;
                return;
            }

            let world = screenToWorld(sx, sy);
            mousePos.x = world.x;
            mousePos.y = world.y;
        });

        canvas.addEventListener('mousedown', (e) => {
            let rect = canvas.getBoundingClientRect();
            let sx = e.clientX - rect.left;
            let sy = e.clientY - rect.top;

            if (e.button === 2 || e.button === 1 || e.shiftKey) {
                isPanning = true;
                panStartX = sx;
                panStartY = sy;
                camStartX = camera.x;
                camStartY = camera.y;
                return;
            }

            let world = screenToWorld(sx, sy);
            let clickX = world.x;
            let clickY = world.y;

            if (currentTool in ROAD_TYPES || currentTool === 'delete' || currentTool === 'upgrade' || currentTool === 'downgrade') {
                dragStartNode = resolveNodeFromCoords(clickX, clickY);
            } else if (currentTool === 'signal') {
                let target = nodes.find(n => Math.hypot(n.x - clickX, n.y - clickY) < 25);
                if (target) {
                    let isHub = hubs.some(h => h.x === target.x && h.y === target.y);
                    if (isHub) {
                        addFloatingText(target.x, target.y - 15, 'Cannot build on Buildings!', '#e74c3c');
                    } else if (target.type !== 'signal') {
                        target.type = 'signal';
                        budget -= 300;
                        addFloatingText(target.x, target.y - 15, '-$300', '#e74c3c');
                        updateUI();
                    }
                }
            } else if (currentTool === 'roundabout') {
                let target = nodes.find(n => Math.hypot(n.x - clickX, n.y - clickY) < 25);
                if (target) {
                    let isHub = hubs.some(h => h.x === target.x && h.y === target.y);
                    if (isHub) {
                        addFloatingText(target.x, target.y - 15, 'Cannot build on Buildings!', '#e74c3c');
                    } else if (target.type !== 'roundabout') {
                        target.type = 'roundabout';
                        budget -= 600;
                        addFloatingText(target.x, target.y - 15, '-$600', '#e74c3c');
                        updateUI();
                    }
                }
            }
        });

        canvas.addEventListener('mouseup', (e) => {
            if (isPanning) {
                isPanning = false;
                return;
            }

            if (dragStartNode) {
                let rect = canvas.getBoundingClientRect();
                let sx = e.clientX - rect.left;
                let sy = e.clientY - rect.top;
                let world = screenToWorld(sx, sy);
                let endNode = getStraightTargetNode(dragStartNode, world.x, world.y);

                if (currentTool in ROAD_TYPES) {
                    if (dragStartNode !== endNode) {
                        let cost = ROAD_TYPES[currentTool].cost;
                        let addedSegments = buildRoadPath(dragStartNode, endNode, currentTool);
                        if (addedSegments > 0) {
                            let totalCost = cost * addedSegments;
                            budget -= totalCost;
                            addFloatingText((dragStartNode.x + endNode.x) / 2, (dragStartNode.y + endNode.y) / 2, `-$${totalCost}`, '#e74c3c');
                            updateUI();
                        }
                    }
                } else if (currentTool === 'delete') {
                    if (dragStartNode !== endNode) {
                        let deletedCount = demolishStraightPath(dragStartNode, endNode);
                        if (deletedCount > 0) {
                            let refund = 20 * deletedCount;
                            budget += refund;
                            addFloatingText((dragStartNode.x + endNode.x) / 2, (dragStartNode.y + endNode.y) / 2, `+$${refund} Refund`, '#2ecc71');
                            updateUI();
                        }
                    } else {
                        // Single-click delete
                        let targetNode = nodes.find(n => Math.hypot(n.x - world.x, n.y - world.y) < 25);
                        if (targetNode) {
                            let isHub = hubs.some(h => h.x === targetNode.x && h.y === targetNode.y);
                            if (!isHub) {
                                nodes = nodes.filter(n => n !== targetNode);
                            }
                            edges = edges.filter(e => e.from !== targetNode && e.to !== targetNode);
                            cars = cars.filter(c => c.currentNode !== targetNode && c.nextNode !== targetNode);
                            updateNodeTypes();
                            budget += 20;
                            addFloatingText(targetNode.x, targetNode.y - 15, '+$20', '#2ecc71');
                            updateUI();
                        }
                    }
                } else if (currentTool === 'upgrade') {
                    if (dragStartNode !== endNode) {
                        let result = upgradeStraightPath(dragStartNode, endNode);
                        if (result.count > 0) {
                            budget -= result.cost;
                            addFloatingText((dragStartNode.x + endNode.x) / 2, (dragStartNode.y + endNode.y) / 2, `-$${result.cost} Upgraded!`, '#00cec9');
                            updateUI();
                        }
                    } else {
                        // Single-click upgrade
                        let targetNode = nodes.find(n => Math.hypot(n.x - world.x, n.y - world.y) < 25);
                        if (targetNode) {
                            let connected = edges.filter(e => e.from === targetNode || e.to === targetNode);
                            let upgraded = 0;
                            let cost = 0;
                            connected.forEach(edge => {
                                if (edge.type === 'local') {
                                    edge.type = 'avenue';
                                    upgraded++;
                                    cost += (ROAD_TYPES.avenue.cost - ROAD_TYPES.local.cost);
                                } else if (edge.type === 'avenue') {
                                    edge.type = 'highway';
                                    upgraded++;
                                    cost += (ROAD_TYPES.highway.cost - ROAD_TYPES.avenue.cost);
                                }
                            });
                            if (upgraded > 0) {
                                budget -= cost;
                                addFloatingText(targetNode.x, targetNode.y - 18, `-$${cost} Upgraded!`, '#00cec9');
                                updateNodeTypes();
                                updateUI();
                            }
                        }
                    }
                } else if (currentTool === 'downgrade') {
                    if (dragStartNode !== endNode) {
                        let result = downgradeStraightPath(dragStartNode, endNode);
                        if (result.count > 0) {
                            budget += result.refund;
                            addFloatingText((dragStartNode.x + endNode.x) / 2, (dragStartNode.y + endNode.y) / 2, `+$${result.refund} Downgraded!`, '#f39c12');
                            updateUI();
                        }
                    } else {
                        // Single-click downgrade
                        let targetNode = nodes.find(n => Math.hypot(n.x - world.x, n.y - world.y) < 25);
                        if (targetNode) {
                            let connected = edges.filter(e => e.from === targetNode || e.to === targetNode);
                            let downgraded = 0;
                            let refund = 0;
                            connected.forEach(edge => {
                                if (edge.type === 'highway') {
                                    edge.type = 'avenue';
                                    downgraded++;
                                    refund += (ROAD_TYPES.highway.cost - ROAD_TYPES.avenue.cost);
                                } else if (edge.type === 'avenue') {
                                    edge.type = 'local';
                                    downgraded++;
                                    refund += (ROAD_TYPES.avenue.cost - ROAD_TYPES.local.cost);
                                }
                                let maxLanes = ROAD_TYPES[edge.type].lanesPerDir;
                                cars.forEach(c => {
                                    let onThisSeg = (c.currentNode === edge.from && c.nextNode === edge.to) || (c.currentNode === edge.to && c.nextNode === edge.from);
                                    if (onThisSeg && c.lane >= maxLanes) {
                                        c.lane = maxLanes - 1;
                                    }
                                });
                            });
                            if (downgraded > 0) {
                                budget += refund;
                                addFloatingText(targetNode.x, targetNode.y - 18, `+$${refund} Downgraded!`, '#f39c12');
                                updateNodeTypes();
                                updateUI();
                            }
                        }
                    }
                }
            }
            dragStartNode = null;
        });

        function updateUI() {
            let budgetEl = document.getElementById('budget-val');
            budgetEl.innerText = `${budget < 0 ? '-' : ''}$${Math.abs(budget).toLocaleString()}`;
            budgetEl.style.color = budget < 0 ? '#e74c3c' : '#2ecc71';
            document.getElementById('cars-val').innerText = cars.length;

            let townCount = hubs.filter(h => h.isSpawn).length;
            let jobCount = hubs.filter(h => !h.isSpawn).length;
            let townsEl = document.getElementById('towns-val');
            let jobsEl = document.getElementById('jobs-val');
            if (townsEl) townsEl.innerText = townCount;
            if (jobsEl) jobsEl.innerText = jobCount;

            let roadUpkeep = edges.reduce((sum, e) => sum + (ROAD_TYPES[e.type]?.upkeep || 0), 0);
            let intersectionUpkeep = nodes.filter(n => n.type === 'signal' || n.type === 'roundabout').length * 5;
            let totalUpkeep = roadUpkeep + intersectionUpkeep;
            let upkeepEl = document.getElementById('upkeep-val');
            if (upkeepEl) upkeepEl.innerText = `-$${totalUpkeep} / 10s`;

            let zoomLevelEl = document.getElementById('zoom-level');
            if (zoomLevelEl) zoomLevelEl.innerText = `${Math.round(camera.zoom * 100)}%`;

            let timeInfo = getGameTimeInfo();
            let timeEl = document.getElementById('time-display');
            let rushEl = document.getElementById('rush-badge');
            let descEl = document.getElementById('commute-desc');
            let clockWidget = document.getElementById('clock-widget');
            if (timeEl) timeEl.innerText = `🕒 ${timeInfo.timeStr}`;
            if (rushEl) {
                rushEl.innerText = `${timeInfo.phaseIcon} ${timeInfo.phase}`;
                rushEl.style.color = timeInfo.phaseColor;
                rushEl.style.background = timeInfo.phaseBadgeBg;
                rushEl.style.borderColor = timeInfo.phaseBorder;
            }
            if (descEl) descEl.innerText = timeInfo.flowDesc;
            if (clockWidget) clockWidget.title = timeInfo.tooltip;
        }

        setInterval(() => {
            nextHubTimer++;
            if (nextHubTimer >= 15) {
                nextHubTimer = 0;
                let margin = 160;
                for (let attempt = 0; attempt < 10; attempt++) {
                    let rx = snap(margin + Math.random() * (WORLD_WIDTH - margin * 2), WORLD_WIDTH);
                    let ry = snap(margin + Math.random() * (WORLD_HEIGHT - margin * 2), WORLD_HEIGHT);
                    if (createHub(rx, ry, Math.random() > 0.4, 20)) break;
                }
            }

            let spawns = hubs.filter(h => h.isSpawn && h.timer <= 0);
            let jobTargets = hubs.filter(h => !h.isSpawn && h.timer <= 0);
            if (spawns.length === 0 || jobTargets.length === 0) return;

            let timeInfo = getGameTimeInfo();
            let spawnBatchCount = Math.max(1, Math.round(spawnMultiplier * timeInfo.rushMultiplier));
            let spawnedThisTick = new Set();

            for (let i = 0; i < spawnBatchCount; i++) {
                // Determine direction based on day/night rush cycles
                let isToJob = Math.random() < timeInfo.toJobProbability;
                let startOriginHub = isToJob ? spawns[Math.floor(Math.random() * spawns.length)] : jobTargets[Math.floor(Math.random() * jobTargets.length)];
                let destinationHub = isToJob ? jobTargets[Math.floor(Math.random() * jobTargets.length)] : spawns[Math.floor(Math.random() * spawns.length)];

                let startNode = nodes.find(n => n.x === startOriginHub.x && n.y === startOriginHub.y);
                let endNode = nodes.find(n => n.x === destinationHub.x && n.y === destinationHub.y);

                if (startNode && endNode && startNode !== endNode) {
                    let path = findPath(startNode, endNode);
                    if (path && path.length > 1) {
                        let edge = edges.find(e => (e.from === path[0] && e.to === path[1]) || (e.to === path[0] && e.from === path[1]));
                        let assignedLane = edge ? selectBestLane(path[0], path[1], edge) : 0;
                        let spawnKey = `${startOriginHub.id}_${assignedLane}`;

                        // Prevent multiple cars from attempting to spawn in the exact same lane in the same tick
                        if (spawnedThisTick.has(spawnKey)) {
                            continue;
                        }

                        let dx0 = path[1].x - path[0].x;
                        let dy0 = path[1].y - path[0].y;
                        let len0 = Math.hypot(dx0, dy0) || 1;
                        let dirX0 = dx0 / len0;
                        let dirY0 = dy0 / len0;
                        let laneOffset0 = 4 + (assignedLane * 7);
                        let startX = path[0].x + (-dirY0 * laneOffset0);
                        let startY = path[0].y + (dirX0 * laneOffset0);

                        // Only count as blocked if another car is stopped/crawling at the driveway (< 0.6 speed)
                        let isBlocked = cars.some(c => {
                            let sameSegment = (c.currentNode === path[0] && c.nextNode === path[1]);
                            return sameSegment && c.lane === assignedLane && Math.hypot(c.x - startX, c.y - startY) < 26 && c.speed < 0.6;
                        });

                        if (!isBlocked) {
                            startOriginHub.blockedCycles = 0;
                            spawnedThisTick.add(spawnKey);
                            let initialSpeed = edge ? Math.min(1.4, ROAD_TYPES[edge.type].speedLimit * 0.7) : 1.2;

                            cars.push({
                                x: startX,
                                y: startY,
                                path: path,
                                pathIdx: 0,
                                currentNode: path[0],
                                nextNode: path[1],
                                targetHubNode: endNode,
                                speed: initialSpeed,
                                lane: assignedLane,
                                color: destinationHub.color,
                                angle: Math.atan2(dy0, dx0),
                                stopTimer: 0,
                                stoppedAtStopSign: false,
                                crossingIntersection: false,
                                inRoundabout: false,
                                roundaboutLane: 0,
                                roundaboutAngle: null
                            });
                        } else {
                            startOriginHub.blockedCycles = (startOriginHub.blockedCycles || 0) + 1;
                            if (startOriginHub.blockedCycles >= 5) {
                                startOriginHub.jamFlash = 50;
                                if (startOriginHub.blockedCycles % 4 === 0) {
                                    budget -= 50;
                                    addFloatingText(startOriginHub.x, startOriginHub.y - 20, '-$50 EXIT JAMMED!', '#ff4757');
                                    updateUI();
                                }
                            }
                        }
                    } else {
                        // Unconnected origin penalty
                        startOriginHub.unconnectedCycles = (startOriginHub.unconnectedCycles || 0) + 1;
                        if (startOriginHub.unconnectedCycles >= 5 && startOriginHub.unconnectedCycles % 5 === 0) {
                            budget -= 50;
                            addFloatingText(startOriginHub.x, startOriginHub.y - 20, '-$50 NO ROAD!', '#ff4757');
                            updateUI();
                        }
                        missingPathLines.push({
                            x1: startOriginHub.x, y1: startOriginHub.y,
                            x2: destinationHub.x, y2: destinationHub.y,
                            life: 90
                        });
                    }
                }
            }
            updateUI();
        }, 600);

        function findPath(start, target) {
            if (!start || !target) return null;
            let openSet = [start];
            let cameFrom = new Map();
            let gScore = new Map();
            let fScore = new Map();

            nodes.forEach(n => { gScore.set(n, Infinity); fScore.set(n, Infinity); });
            gScore.set(start, 0);
            fScore.set(start, Math.hypot(start.x - target.x, start.y - target.y));

            while (openSet.length > 0) {
                openSet.sort((a, b) => fScore.get(a) - fScore.get(b));
                let current = openSet.shift();

                if (Math.hypot(current.x - target.x, current.y - target.y) < 5) {
                    let totalPath = [current];
                    while (cameFrom.has(current)) {
                        current = cameFrom.get(current);
                        totalPath.unshift(current);
                    }
                    return totalPath;
                }

                let neighbors = [];
                edges.forEach(e => {
                    if (e.from === current) neighbors.push(e.to);
                    if (e.to === current) neighbors.push(e.from);
                });

                for (let neighbor of neighbors) {
                    let dist = Math.hypot(current.x - neighbor.x, current.y - neighbor.y);
                    let tentativeG = gScore.get(current) + dist;
                    if (tentativeG < gScore.get(neighbor)) {
                        cameFrom.set(neighbor, current);
                        gScore.set(neighbor, tentativeG);
                        fScore.set(neighbor, tentativeG + Math.hypot(neighbor.x - target.x, neighbor.y - target.y));
                        if (!openSet.includes(neighbor)) openSet.push(neighbor);
                    }
                }
            }
            return null;
        }

        function update() {
            gameMinutes = (gameMinutes + 0.06) % 1440;
            edges.forEach(e => { e.congestion = Math.max(0, e.congestion - 0.03); });
            hubs.forEach(h => { if (h.jamFlash > 0) h.jamFlash--; });

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y -= 0.6;
                ft.life--;
                ft.opacity = ft.life / 60;
                if (ft.life <= 0) floatingTexts.splice(i, 1);
            }

            for (let i = missingPathLines.length - 1; i >= 0; i--) {
                let line = missingPathLines[i];
                line.life--;
                if (line.life <= 0) missingPathLines.splice(i, 1);
            }

            for (let i = cars.length - 1; i >= 0; i--) {
                let car = cars[i];
                if (!car.nextNode) { cars.splice(i, 1); continue; }

                let edge = edges.find(e => (e.from === car.currentNode && e.to === car.nextNode) || (e.from === car.nextNode && e.to === car.currentNode));
                let roadStyle = edge ? ROAD_TYPES[edge.type] : ROAD_TYPES.local;

                if (edge && car.speed < 0.8) {
                    edge.congestion = Math.min(100, edge.congestion + 0.4);
                }

                if (car.inRoundabout) {
                    let rNode = car.roundaboutCenter;
                    let specs = getRoundaboutSpecs(rNode);
                    let laneRadius = specs.radius + 3 - (car.roundaboutLane * 7);
                    let maxCircleSpeed = 1.4;
                    let destNode = car.roundaboutExitNode;
                    if (!destNode || destNode === rNode) {
                        if (car.path) {
                            let nIdx = car.path.findIndex((n, idx) => idx > car.pathIdx && n !== rNode);
                            if (nIdx !== -1) destNode = car.path[nIdx];
                        }
                        if (!destNode || destNode === rNode) {
                            destNode = (car.nextNode && car.nextNode !== rNode) ? car.nextNode : car.targetHubNode;
                        }
                    }

                    let brakeInRoundabout = false;
                    let targetFollowSpeed = maxCircleSpeed;

                    for (let j = 0; j < cars.length; j++) {
                        if (i === j) continue;
                        let other = cars[j];

                        // Check A: Other car is in the same roundabout and same lane ahead
                        if (other.inRoundabout && other.roundaboutCenter === rNode && other.roundaboutLane === car.roundaboutLane) {
                            let angleDiff = ((car.roundaboutAngle - other.roundaboutAngle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
                            let dist = Math.hypot(other.x - car.x, other.y - car.y);

                            if (angleDiff > 0.01 && angleDiff < 0.85) {
                                brakeInRoundabout = true;
                                if (dist < 16) {
                                    targetFollowSpeed = Math.min(targetFollowSpeed, 0);
                                } else {
                                    let safeTargetSpeed = Math.max(0.3, ((dist - 14) / 22) * maxCircleSpeed);
                                    targetFollowSpeed = Math.min(targetFollowSpeed, safeTargetSpeed);
                                }
                            }
                        }

                        // Check B: Other car has exited onto our target outbound road but is still queueing near the exit
                        if (!other.inRoundabout && destNode && other.currentNode === rNode && other.nextNode === destNode) {
                            let dist = Math.hypot(other.x - car.x, other.y - car.y);
                            if (dist < 24) {
                                brakeInRoundabout = true;
                                if (dist < 16) {
                                    targetFollowSpeed = Math.min(targetFollowSpeed, 0);
                                } else {
                                    let safeTargetSpeed = Math.max(0.3, ((dist - 14) / 22) * maxCircleSpeed);
                                    targetFollowSpeed = Math.min(targetFollowSpeed, safeTargetSpeed);
                                }
                            }
                        }
                    }

                    if (brakeInRoundabout) {
                        car.speed = Math.max(0, Math.min(car.speed, targetFollowSpeed));
                    } else {
                        car.speed = Math.min(maxCircleSpeed, car.speed + 0.08);
                    }

                    // Anti-gridlock crawl: Ensure cars in the roundabout never get stuck in a mutual lock
                    if (car.speed < 0.25) {
                        car.stuckTimer = (car.stuckTimer || 0) + 1;
                        if (car.stuckTimer > 25) {
                            car.speed = 0.45; // Anti-deadlock crawl to reach exit
                        }
                    } else {
                        car.stuckTimer = 0;
                    }

                    // Physically accurate angular velocity v / r
                    let angularVelocity = car.speed / laneRadius;
                    car.roundaboutAngle -= angularVelocity;
                    car.roundaboutLaps = (car.roundaboutLaps || 0) + (angularVelocity / (Math.PI * 2));
                    car.x = rNode.x + Math.cos(car.roundaboutAngle) * laneRadius;
                    car.y = rNode.y + Math.sin(car.roundaboutAngle) * laneRadius;
                    car.angle = car.roundaboutAngle - Math.PI / 2;

                    if (destNode && destNode !== rNode) {
                        let outDx = destNode.x - rNode.x;
                        let outDy = destNode.y - rNode.y;
                        let outLen = Math.hypot(outDx, outDy) || 1;
                        let outDirX = outDx / outLen;
                        let outDirY = outDy / outLen;
                        let outRightNx = -outDirY;
                        let outRightNy = outDirX;
                        let outLaneOffset = 4 + (car.lane * 7);
                        let exitBackoff = Math.sqrt(Math.max(0, laneRadius * laneRadius - outLaneOffset * outLaneOffset));
                        let exitPointX = rNode.x + (outDirX * exitBackoff) + (outRightNx * outLaneOffset);
                        let exitPointY = rNode.y + (outDirY * exitBackoff) + (outRightNy * outLaneOffset);
                        let roadAngle = Math.atan2(outDy, outDx);

                        // Use the angle of the exit point ON the ring as the target.
                        // exitPointX/Y is already on the circle, so atan2 gives exact exit angle.
                        let exitAngle = Math.atan2(exitPointY - rNode.y, exitPointX - rNode.x);
                        let normCarAngle  = ((car.roundaboutAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
                        let normExitAngle = ((exitAngle            % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
                        let diff = Math.abs(normCarAngle - normExitAngle);
                        if (diff > Math.PI) diff = 2 * Math.PI - diff;

                        // Don't exit if a stopped car is sitting right at the exit mouth
                        let exitBlocked = cars.some(other => {
                            if (other === car || other.inRoundabout) return false;
                            return other.speed < 0.15 && Math.hypot(other.x - exitPointX, other.y - exitPointY) < 20;
                        });

                        // Exit when within 0.5 rad of exit point, or after 0.9 laps (hard failsafe)
                        if ((diff < 0.5 || car.roundaboutLaps >= 0.9) && !exitBlocked) {
                            car.inRoundabout = false;
                            car.roundaboutAngle = null;
                            car.roundaboutCenter = null;
                            car.roundaboutExitNode = null;
                            car.roundaboutLaps = 0;
                            car.stuckTimer = 0;
                            car.x = exitPointX;
                            car.y = exitPointY;
                            car.angle = roadAngle;
                            car.currentNode = rNode;
                            car.nextNode = destNode;
                            car.pathIdx++;
                            let exitEdge = edges.find(e => (e.from === car.currentNode && e.to === car.nextNode) || (e.from === car.nextNode && e.to === car.currentNode));
                            if (exitEdge) car.lane = selectBestLane(car.currentNode, car.nextNode, exitEdge);
                            let leadOutbound = cars.find(other => other !== car && other.currentNode === rNode && other.nextNode === destNode && other.lane === car.lane && Math.hypot(other.x - car.x, other.y - car.y) < 30);
                            car.speed = leadOutbound ? Math.max(0.8, Math.min(car.speed, leadOutbound.speed)) : Math.max(car.speed, 1.4);
                        }
                    }
                    continue;
                }

                let dx = car.nextNode.x - car.currentNode.x;
                let dy = car.nextNode.y - car.currentNode.y;
                let len = Math.hypot(dx, dy);
                let dirX = dx / (len || 1);
                let dirY = dy / (len || 1);

                // Right-side driving lane offset calculation
                let laneWidth = 7;
                let rightSideBase = 4;
                let laneOffset = rightSideBase + (car.lane * laneWidth);

                // Normal vector perpendicular to travel direction pointing to the RIGHT side
                let rightNx = -dirY;
                let rightNy = dirX;

                let targetX = car.nextNode.x + (rightNx * laneOffset);
                let targetY = car.nextNode.y + (rightNy * laneOffset);
                let distToTargetNode = Math.hypot(car.nextNode.x - car.x, car.nextNode.y - car.y);
                let distToTarget = Math.hypot(targetX - car.x, targetY - car.y);

                let stopRequired = false;
                let stopLineDist = 18;

                // Yield to circulating traffic and seamlessly merge when approaching a roundabout
                if (car.nextNode.type === 'roundabout') {
                    let rNode = car.nextNode;
                    let specs = getRoundaboutSpecs(rNode);
                    let targetLane = car.lane % specs.lanes;
                    let laneRadius = specs.radius + 3 - (targetLane * 7);
                    let entryBackoff = Math.sqrt(Math.max(0, laneRadius * laneRadius - laneOffset * laneOffset));

                    let carsInRing = cars.filter(c => c.inRoundabout && c.roundaboutCenter === rNode).length;
                    let ringCapacity = specs.lanes * 4;

                    if (distToTargetNode < entryBackoff + 35) {
                        let entryAngle = Math.atan2(car.y - rNode.y, car.x - rNode.x);
                        let circulatingCarApproaching = cars.some(other => {
                            if (other === car || !other.inRoundabout || other.roundaboutCenter !== rNode) return false;
                            let angleDiff = ((other.roundaboutAngle - entryAngle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
                            return angleDiff > 0.08 && angleDiff < 1.15;
                        });

                        if (circulatingCarApproaching || carsInRing >= ringCapacity) {
                            stopRequired = true;
                            if (distToTargetNode <= entryBackoff + 3) {
                                car.speed = 0;
                            } else {
                                let targetDecelSpeed = Math.max(0.2, ((distToTargetNode - entryBackoff) / 25) * roadStyle.speedLimit);
                                car.speed = Math.max(0, Math.min(targetDecelSpeed, car.speed - 0.15));
                            }
                        }
                    }

                    // Seamless merge directly into circular arc at the exact geometric tangent point
                    if (!stopRequired && distToTargetNode <= entryBackoff + 2) {
                        car.inRoundabout = true;
                        car.roundaboutCenter = rNode;
                        car.roundaboutLane = targetLane;
                        car.roundaboutAngle = Math.atan2(car.y - rNode.y, car.x - rNode.x);
                        let nextExitNode = (car.path && car.pathIdx + 2 < car.path.length) ? car.path[car.pathIdx + 2] : null;
                        car.roundaboutExitNode = nextExitNode;
                        car.currentNode = rNode;
                        car.nextNode = nextExitNode || car.targetHubNode;
                        car.pathIdx++;
                    }
                }

                if (car.nextNode.type === 'stopsign' && !car.stoppedAtStopSign) {
                    if (distToTargetNode < 45) {
                        stopRequired = true;
                        if (distToTargetNode <= stopLineDist + 3) {
                            car.speed = 0;
                            car.stopTimer++;
                            if (car.stopTimer > 20) {
                                car.stoppedAtStopSign = true;
                                stopRequired = false;
                            }
                        } else {
                            let targetDecelSpeed = Math.max(0.3, ((distToTargetNode - stopLineDist) / 27) * roadStyle.speedLimit);
                            if (car.speed < targetDecelSpeed) {
                                car.speed = Math.min(targetDecelSpeed, car.speed + 0.08);
                            } else {
                                car.speed = Math.max(targetDecelSpeed, car.speed - 0.2);
                            }
                        }
                    }
                }

                if (car.nextNode.type === 'signal') {
                    let isNorthSouth = Math.abs(dy) > Math.abs(dx);
                    let greenActive = isNorthSouth ? (car.nextNode.signalState === 'NS_GREEN') : (car.nextNode.signalState === 'EW_GREEN');
                    if (!greenActive && distToTargetNode < 50) {
                        stopRequired = true;
                        if (distToTargetNode <= stopLineDist + 3) {
                            car.speed = 0;
                        } else {
                            let targetDecelSpeed = Math.max(0.3, ((distToTargetNode - stopLineDist) / 32) * roadStyle.speedLimit);
                            if (car.speed < targetDecelSpeed) {
                                car.speed = Math.min(targetDecelSpeed, car.speed + 0.08);
                            } else {
                                car.speed = Math.max(targetDecelSpeed, car.speed - 0.2);
                            }
                        }
                    }
                }

                // Vehicle-to-vehicle braking and queuing check
                let brakeForCar = false;
                let minFollowGap = 20;
                let lookaheadDist = minFollowGap + Math.max(20, car.speed * 12);

                for (let j = 0; j < cars.length; j++) {
                    if (i === j) continue;
                    let other = cars[j];

                    // Case 1: Same road segment and same lane ahead of us
                    if (other.currentNode === car.currentNode && other.nextNode === car.nextNode && other.lane === car.lane) {
                        let forwardDist = ((other.x - car.x) * dirX) + ((other.y - car.y) * dirY);
                        if (forwardDist > 0 && forwardDist < lookaheadDist) {
                            brakeForCar = true;
                            if (forwardDist <= minFollowGap) {
                                car.speed = 0;
                                break;
                            } else {
                                let gapRatio = (forwardDist - minFollowGap) / (lookaheadDist - minFollowGap);
                                let approachSpeed = Math.max(0.2, gapRatio * roadStyle.speedLimit);
                                if (other.speed > 0) {
                                    car.speed = Math.min(car.speed, Math.max(other.speed, approachSpeed));
                                } else {
                                    car.speed = Math.min(car.speed, approachSpeed);
                                }
                            }
                        }
                    } 
                    // Case 2: At stop sign intersection — check priority once stopped and ready to cross
                    else if (car.nextNode.type === 'stopsign' && car.stoppedAtStopSign && !car.crossingIntersection && distToTargetNode <= 22) {
                        // Check other cars stopped at the same stop sign with priority
                        if (other.nextNode === car.nextNode) {
                            let otherDist = Math.hypot(other.x - car.nextNode.x, other.y - car.nextNode.y);
                            let otherHasPriority = other.stoppedAtStopSign &&
                                (other.stopTimer > car.stopTimer || (other.stopTimer === car.stopTimer && j < i));
                            if (otherHasPriority && otherDist < 24) {
                                brakeForCar = true;
                                car.speed = 0;
                                break;
                            }
                        }
                        // Block if ANY car is physically inside the intersection box
                        let otherDistToNode = Math.hypot(other.x - car.nextNode.x, other.y - car.nextNode.y);
                        if (otherDistToNode < 12) {
                            brakeForCar = true;
                            car.speed = 0;
                            break;
                        }
                        // Anti box-blocking: check if a car is stuck in the exit mouth (within ~20px of node, slow)
                        let crossNextNode = (car.path && car.pathIdx + 2 < car.path.length) ? car.path[car.pathIdx + 2] : null;
                        if (crossNextNode) {
                            // The exit mouth is just beyond the stopsign node toward crossNextNode
                            let mouthDx = crossNextNode.x - car.nextNode.x;
                            let mouthDy = crossNextNode.y - car.nextNode.y;
                            let mouthLen = Math.hypot(mouthDx, mouthDy) || 1;
                            let exitMouthX = car.nextNode.x + (mouthDx / mouthLen) * 18;
                            let exitMouthY = car.nextNode.y + (mouthDy / mouthLen) * 18;
                            if (!other.inRoundabout && other.speed < 0.1 &&
                                Math.hypot(other.x - exitMouthX, other.y - exitMouthY) < 18) {
                                brakeForCar = true;
                                car.speed = 0;
                                break;
                            }
                        }
                    }
                    // Case 3: Outbound lane clearance
                    let nextNextNode = (car.path && car.pathIdx + 2 < car.path.length) ? car.path[car.pathIdx + 2] : null;
                    if (nextNextNode && other.currentNode === car.nextNode && other.nextNode === nextNextNode && other.lane === car.lane) {
                        let dist = Math.hypot(other.x - car.x, other.y - car.y);
                        if (dist < minFollowGap + 4) {
                            brakeForCar = true;
                            car.speed = 0;
                            break;
                        }
                    }
                }

                if (!stopRequired && !brakeForCar) {
                    car.speed = Math.min(roadStyle.speedLimit, car.speed + 0.08);
                    if (car.stoppedAtStopSign) {
                        car.crossingIntersection = true;
                    }
                }

                if (!stopRequired && !brakeForCar && (distToTarget < Math.max(10, car.speed * 2) || distToTargetNode < 12)) {
                    car.currentNode = car.nextNode;
                    car.pathIdx++;
                    if (car.currentNode === car.targetHubNode || car.pathIdx >= car.path.length - 1) {
                        cars.splice(i, 1);
                        budget += 25;
                        addFloatingText(car.x, car.y - 10, '+$25', '#2ecc71');
                        updateUI();
                        continue;
                    } else {
                        car.nextNode = car.path[car.pathIdx + 1];
                        let nextEdge = edges.find(e => (e.from === car.currentNode && e.to === car.nextNode) || (e.from === car.nextNode && e.to === car.currentNode));
                        if (nextEdge) {
                            if (car.speed < 1.0) {
                                car.lane = selectBestLane(car.currentNode, car.nextNode, nextEdge);
                            }
                        }
                        car.stoppedAtStopSign = false;
                        car.crossingIntersection = false;
                        car.stopTimer = 0;
                    }
                } else if (car.speed > 0) {
                    let moveX = (targetX - car.x) / (distToTarget || 1);
                    let moveY = (targetY - car.y) / (distToTarget || 1);
                    car.x += moveX * car.speed;
                    car.y += moveY * car.speed;
                    car.angle = Math.atan2(moveY, moveX);
                }
            }
        }

        function drawHub(ctx, h, connected) {
            ctx.save();
            let hubNum = h.hubNumber || h.id;
            
            let isJammed = h.isSpawn && ((h.blockedCycles && h.blockedCycles > 0) || (h.jamFlash && h.jamFlash > 0));

            // Pulsing Emergency Warning Ripple for Jammed Buildings
            if (isJammed) {
                let pulse = (Math.sin(Date.now() / 90) + 1) / 2;
                let rippleRadius = 16 + pulse * 6;
                ctx.strokeStyle = `rgba(255, 71, 87, ${0.35 + pulse * 0.45})`;
                ctx.lineWidth = 1.5 + pulse * 1.5;
                ctx.beginPath();
                ctx.arc(h.x, h.y, rippleRadius, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = '#ff4757';
                ctx.font = 'bold 13px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('⚠️', h.x, h.y - 34 - (pulse * 2));
            }

            // 1. Ambient Drop Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.38)';
            ctx.beginPath();
            if (h.isSpawn) {
                ctx.arc(h.x, h.y + 2, 23, 0, Math.PI * 2);
            } else {
                ctx.roundRect(h.x - 22, h.y - 20, 44, 44, 6);
            }
            ctx.fill();

            if (h.isSpawn) {
                // ==========================================
                // 🏡 RESIDENTIAL HOMES (SUBURBAN CUL-DE-SAC)
                // ==========================================
                // Green Yard Estate
                ctx.fillStyle = '#2f4f2f';
                ctx.beginPath();
                ctx.arc(h.x, h.y, 22, 0, Math.PI * 2);
                ctx.fill();

                // White Picket Post Perimeter / Status Outline
                ctx.lineWidth = 2.5;
                if (isJammed) {
                    ctx.strokeStyle = '#ff4757';
                    ctx.lineWidth = 3.5;
                    ctx.setLineDash([]);
                } else if (h.timer > 0) {
                    ctx.strokeStyle = '#f1c40f';
                    ctx.setLineDash([4, 3]);
                } else if (connected) {
                    ctx.strokeStyle = '#2ecc71';
                    ctx.setLineDash([]);
                } else {
                    ctx.strokeStyle = '#e74c3c';
                    ctx.setLineDash([]);
                }
                ctx.stroke();
                ctx.setLineDash([]);

                // Cobblestone walkway
                ctx.fillStyle = '#7f8c8d';
                ctx.beginPath();
                ctx.moveTo(h.x, h.y + 19);
                ctx.lineTo(h.x - 4, h.y + 5);
                ctx.lineTo(h.x + 4, h.y + 5);
                ctx.fill();

                // Mini Green Trees
                ctx.fillStyle = '#1e824c';
                ctx.beginPath(); ctx.arc(h.x - 13, h.y + 8, 4, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(h.x + 13, h.y + 8, 4, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#2ecc71';
                ctx.beginPath(); ctx.arc(h.x - 14, h.y + 6.5, 2, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(h.x + 12, h.y + 6.5, 2, 0, Math.PI * 2); ctx.fill();

                // Main Suburban House (Left) — tinted with town's color
                let tc = h.color || '#c0392b';
                // Parse hex to a slightly darker shade for the roof
                ctx.fillStyle = tc;
                ctx.fillRect(h.x - 16, h.y - 12, 14, 18);
                // Pitched Gable Roof (darker tint)
                ctx.fillStyle = 'rgba(0,0,0,0.35)';
                ctx.fillRect(h.x - 16, h.y - 12, 14, 18); // darken wall slightly
                ctx.fillStyle = tc;
                ctx.globalAlpha = 0.7;
                ctx.beginPath();
                ctx.moveTo(h.x - 17, h.y - 12);
                ctx.lineTo(h.x - 9, h.y - 19);
                ctx.lineTo(h.x - 1, h.y - 12);
                ctx.fill();
